<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои подарки</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky1:#ffe6cf;--sky2:#ffc9d6;--sky3:#cbbcf5;--h1:#8fcf9d;--h2:#b9e2b3;--sun1:#fff7d9;--sun2:#ffd08a;
--card:#fffaf1;--ink:#4a3328;--mut:#8d7466;--acc:#ff7a59;--acc2:#ffd9b8;--line:#f0dfcb;--stitch:#e8b9a0;--track:#f6e3d3;--tape:#ffb3c7;--sh:0 8px 20px rgba(140,70,60,.18);
--hand:'Caveat','Segoe Print','Bradley Hand',cursive;--ui:'Nunito',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1a1640;--sky2:#3b2259;--sky3:#6c3b66;--h1:#233a3a;--h2:#2e4a46;--sun1:#ffffff;--sun2:#c9d4ff;--card:#33273b;--ink:#fbeedd;--mut:#c0a9b5;--acc:#ff8f6b;--acc2:#5a3a52;--line:#4a3a52;--stitch:#7a5a78;--track:#43324a;--tape:#b58aff;--sh:0 8px 22px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#1a1640;--sky2:#3b2259;--sky3:#6c3b66;--h1:#233a3a;--h2:#2e4a46;--sun1:#ffffff;--sun2:#c9d4ff;--card:#33273b;--ink:#fbeedd;--mut:#c0a9b5;--acc:#ff8f6b;--acc2:#5a3a52;--line:#4a3a52;--stitch:#7a5a78;--track:#43324a;--tape:#b58aff;--sh:0 8px 22px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000}
body{margin:0;min-height:100svh;background:#000;color:var(--ink);font:17px/1.45 var(--ui)}
button,input{font-family:var(--ui)}
#world{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#cv{position:fixed;inset:0;z-index:8;pointer-events:none}
#app{position:relative;z-index:1}
.sun{position:absolute;top:6vh;right:8vw;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,var(--sun1) 30%,var(--sun2) 58%,transparent 72%);animation:pl 6s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.12);opacity:.85}}
.cloud{position:absolute;width:120px;height:36px;border-radius:40px;background:rgba(255,255,255,.55);filter:blur(1px);animation:dr 60s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:50px;height:50px;top:-24px;left:18px}.cloud::after{width:36px;height:36px;top:-14px;left:62px}
.c1{top:14vh;left:-150px}.c2{top:30vh;left:-150px;animation-duration:90s;animation-delay:-40s;transform:scale(.7)}
@keyframes dr{to{transform:translateX(calc(100vw + 300px))}}
@media (prefers-color-scheme:dark){.cloud{background:rgba(255,255,255,.08)}}
.hills{position:absolute;left:0;bottom:0;width:100%;height:30vh}
.dec{position:absolute;bottom:2.5vh;font-size:30px;transform-origin:bottom;animation:sw 4s ease-in-out infinite}
@keyframes sw{50%{transform:rotate(6deg)}}
.top{text-align:center;padding:30px 16px 6px}.top h1{display:inline-block;margin:0;max-width:100%;font:700 48px/1 var(--hand);color:#ff7fb0;background:var(--card);padding:5px 22px 8px;border-radius:99px;box-shadow:var(--sh);--r:0deg;--d:0s;transform:rotate(var(--r));animation:fl 5s ease-in-out infinite}.top p{margin:6px 0 0;font:600 22px var(--hand);color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 18px;padding:22px 20px 140px;max-width:560px;margin:0 auto}
.lab{display:inline-block;max-width:100%;font:700 24px/1 var(--hand);background:var(--card);padding:5px 14px 6px;border-radius:99px;box-shadow:var(--sh);margin:0 0 12px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it{position:relative;transform:rotate(var(--r));animation:fl 5s ease-in-out var(--d) infinite}
@keyframes fl{50%{transform:rotate(var(--r)) translateY(-7px)}}
.it:nth-child(3n+2){--tape:#9fd8c8}.it:nth-child(3n){--tape:#ffd47a}
.tile,.c{position:relative;background-color:var(--card);background-image:radial-gradient(rgba(160,100,70,.09) 1px,transparent 1.4px);background-size:7px 7px}
.tile::after,.c::after{content:"";position:absolute;inset:9px;border:2px dashed var(--stitch);border-radius:20px;pointer-events:none}
.tile::before,.c::before{content:"";position:absolute;top:-9px;left:50%;width:70px;height:22px;margin-left:-35px;transform:rotate(-3deg);background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px),var(--tape);opacity:.92;border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.12);z-index:2}
.tile{width:100%;aspect-ratio:1/1;border:0;border-radius:28px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);cursor:pointer;padding:12px;transition:transform .15s}
.tile:active{transform:scale(.94) rotate(-2deg)}
.tile .em{font-size:60px;line-height:1.1;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px) rotate(4deg)}}
.tile .pc{font:700 40px/1 var(--hand)}
.tile .bar{position:absolute;left:24px;right:24px;bottom:22px;height:9px;border-radius:9px;background:var(--track);z-index:1}.tile .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9a6b,#ff5fa2);border-radius:9px}
.tile.soon{cursor:default;color:var(--mut)}.tile.soon .pc{font-size:34px}
.tile.add{color:var(--acc)}.tile.add .em{font-size:48px}
/* заметки */
.it>.lab{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);margin:0;z-index:4;font-size:20px;max-width:84%;box-shadow:0 1px 3px rgba(120,50,60,.25)}
.tile{padding-bottom:58px}.tile .em{font-size:52px}.tile:not(.photo) .bar{bottom:52px}
.tile:not(.photo){color:#6e3b44;background-image:none;background-blend-mode:normal;border-radius:6px;box-shadow:0 8px 14px rgba(120,50,60,.22),0 1px 2px rgba(120,50,60,.2)}
.tile:not(.photo) .bar{background:rgba(150,70,85,.18)}
.tile:not(.photo)::after{border:0;inset:0;border-radius:inherit}
.tile:not(.photo)::before{background:none;box-shadow:none;margin:0;opacity:1;transform:none;border-radius:0;left:auto;top:auto;width:auto;height:auto}
/* 2 — карман со стежком и бежевым скотчем */
.it:nth-child(7n+2) .tile:not(.photo){background:#ecd3d8;border:2px solid #b89aa0;border-radius:6px 6px 22px 34px/6px 6px 30px 18px}
.it:nth-child(7n+2) .tile:not(.photo)::after{inset:9px;border:2px dashed #a58088;border-radius:4px 4px 18px 28px}
.it:nth-child(7n+2) .tile:not(.photo)::before{content:"";left:50%;top:-12px;width:84px;height:24px;margin-left:-42px;background:#f3e4cc;opacity:.9;transform:rotate(-2deg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
/* 3 — лососевый квадрат с красной кнопкой */
.it:nth-child(7n+3) .tile:not(.photo){background:#fda5a5;border:1px solid rgba(90,30,30,.45);border-radius:2px}
.it:nth-child(7n+3) .tile:not(.photo)::after{display:none}
.it:nth-child(7n+3) .tile:not(.photo)::before{content:"";right:12px;top:-8px;left:auto;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a9a,#e0262b 55%,#a31216);box-shadow:2px 4px 4px rgba(0,0,0,.3)}
/* 4 — блокнот на спирали */
.it:nth-child(7n+4) .tile:not(.photo){background:repeating-linear-gradient(transparent 0 22px,rgba(90,30,60,.45) 22px 23px) 0 30px/100% 100% no-repeat,#f7799f;border-radius:3px}
.it:nth-child(7n+4) .tile:not(.photo)::after{display:none}
.it:nth-child(7n+4) .tile:not(.photo)::before{content:"";left:6%;right:6%;top:-9px;height:18px;border-radius:4px;background:repeating-linear-gradient(90deg,#2a2226 0 6px,transparent 6px 22px)}
/* 5 — дырочки слева и бирюзовый скотч */
.it:nth-child(7n+5) .tile:not(.photo){background:#ffb9c8;border-radius:4px 14px 4px 4px;transform:rotate(1.5deg)}
.it:nth-child(7n+5) .tile:not(.photo)::after{inset:14px auto 14px 7px;width:10px;border-radius:0;background:radial-gradient(circle,#fff 4px,rgba(0,0,0,.12) 5px,transparent 6px) 0 0/10px 30px repeat-y}
.it:nth-child(7n+5) .tile:not(.photo)::before{content:"";left:34%;top:-9px;width:64px;height:20px;background:#5cc6ca;opacity:.9;transform:rotate(-4deg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
/* 6 — клетка с рваным краем и двумя скотчами */
.it:nth-child(7n+6) .tile:not(.photo){background:linear-gradient(rgba(240,140,165,.55) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(240,140,165,.55) 1px,transparent 1px) 0 0/16px 16px,#fde4ea;border-radius:3px 9px 4px 11px/7px 3px 9px 4px;transform:rotate(-1.5deg)}
.it:nth-child(7n+6) .tile:not(.photo)::after{inset:auto -12px -8px auto;width:52px;height:20px;background:#f1cdb3;opacity:.9;transform:rotate(-35deg);border-radius:0;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.it:nth-child(7n+6) .tile:not(.photo)::before{content:"";left:-14px;top:4px;width:52px;height:20px;background:#f1cdb3;opacity:.9;transform:rotate(-38deg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
/* 7 — обычный стикер с загнутым уголком и полоской */
.it:nth-child(7n+7) .tile:not(.photo){background:#ffc4d3;border-radius:2px;box-shadow:0 10px 16px rgba(120,50,60,.25),-2px 3px 3px rgba(120,50,60,.12)}
.it:nth-child(7n+7) .tile:not(.photo)::before{content:"";left:0;right:0;top:0;height:16px;background:#f490aa}
.it:nth-child(7n+7) .tile:not(.photo)::after{inset:auto 0 0 auto;width:30px;height:30px;border-radius:0;background:linear-gradient(315deg,#fff 0 50%,#e58aa3 50%);box-shadow:-2px -2px 3px rgba(0,0,0,.1)}
/* 8 — линейка с сердечком и дырками сверху */
.it:nth-child(7n+1) .tile:not(.photo){background:repeating-linear-gradient(transparent 0 30px,rgba(235,110,130,.6) 30px 32px) 0 26px/100% 100% no-repeat,#ffd1db;border-radius:7px}
.it:nth-child(7n+1) .tile:not(.photo)::after{inset:9px 14px auto;height:8px;border-radius:0;background:radial-gradient(circle,#fff 3px,transparent 4px) 0 0/22px 8px repeat-x}
.it:nth-child(7n+1) .tile:not(.photo)::before{content:"♥";right:10px;top:-14px;left:auto;font-size:40px;line-height:1;color:#d9566f;transform:rotate(10deg);text-shadow:0 2px 2px rgba(0,0,0,.15)}
.it .tile:not(.photo){border-radius:14px!important}
.it:nth-child(7n) .tile:not(.photo)::before{border-radius:14px 14px 0 0}
.it:nth-child(7n) .tile:not(.photo)::after{border-radius:0 0 14px 0}
.tile .ph{width:64px;height:64px;object-fit:cover;border-radius:8px;border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.22);transform:rotate(-2deg);flex:none}
.c .ph{width:84px;height:84px;object-fit:cover;border-radius:10px;border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.2);display:block;margin:0 auto 8px}
.back{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;margin:10px 0 0 14px;border:0;border-radius:99px;background:var(--card);box-shadow:var(--sh);color:var(--ink);font:700 26px/1 var(--hand);padding:10px 20px 12px;cursor:pointer}
.hero{min-height:calc(100svh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px 30px;text-align:center}
.theme{font:700 34px/1 var(--hand);background:var(--card);padding:6px 20px 8px;border-radius:99px;box-shadow:var(--sh)}
.ringw{position:relative;width:min(88vw,50svh,420px);aspect-ratio:1/1;margin:20px 0 14px;filter:drop-shadow(0 0 14px rgba(255,120,150,.45))}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.arc{transition:stroke-dashoffset 1.4s cubic-bezier(.3,.8,.3,1)}
.ringw .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 clamp(72px,26vw,140px) var(--hand);text-shadow:0 3px 0 rgba(255,255,255,.35)}
.last{margin:6px 0 0;font:600 28px/1.1 var(--hand)}.last b{color:var(--acc)}
.scroll{margin-top:26px;font:600 24px var(--hand);animation:b 1.8s infinite}@keyframes b{50%{transform:translateY(8px)}}
.cards{max-width:560px;margin:0 auto;padding:10px 20px 60px;display:grid;gap:26px}
.cards>:nth-child(2n){--tape:#9fd8c8}.cards>:nth-child(3n){--tape:#ffd47a}
.c{border-radius:28px;box-shadow:var(--sh);padding:30px 26px 26px}
.c h3{margin:0 0 6px;font:700 26px/1 var(--hand);color:var(--mut)}
.c .big{font:700 62px/1 var(--hand);color:var(--acc)}.c .txt{font-size:20px;line-height:1.4;font-weight:700}.c .e{font-size:40px;float:right;margin-left:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row2 .c{padding:28px 18px 22px;text-align:center}
.own label{display:block;font:700 14px var(--ui);color:var(--mut);margin:14px 0 4px;position:relative;z-index:3}
.own input{position:relative;z-index:3;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--sky1);color:var(--ink);font-size:17px}
.btns{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:3}.btns button,.pub,.dl{border:0;border-radius:14px;background:var(--acc2);color:var(--ink);font-weight:800;font-size:18px;padding:14px 16px;min-height:52px;flex:1;cursor:pointer}
.btns button:active{background:var(--acc);color:#fff}
.dl{position:relative;z-index:3;background:transparent;color:#d04a3a;border:1px solid #d04a3a;width:100%;margin-top:18px}
.bar2{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:9}
.pub{width:100%;background:linear-gradient(90deg,#ff9a6b,#ff5fa2);color:#fff;font-size:19px}.pub:disabled{opacity:.5}
#msg{text-align:center;font:13px var(--ui);color:var(--mut);margin-top:6px;min-height:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;display:flex;flex-direction:column;justify-content:space-around;pointer-events:none;background:#000}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(0,0,0,.2),rgba(0,0,0,.7) 85%),linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.1) 30%,rgba(0,0,0,.6))}
.rw{display:flex;flex:none;gap:16px;width:max-content;filter:blur(1.5px) brightness(.8);opacity:.95;animation:sl 70s linear infinite}
.rw.r{animation-direction:reverse;animation-duration:90s}.rw.s{animation-duration:110s}
@keyframes sl{to{transform:translateX(-50%)}}
.bt{width:clamp(84px,27vw,210px);aspect-ratio:210/266;flex:none;background-color:#222;border:2px solid rgba(255,134,172,.6);box-shadow:3px 3px 0 rgba(0,0,0,.6)}
.rw{gap:clamp(8px,2.5vw,16px)}
body.det{--sky1:#1a1640;--sky2:#3b2259;--sky3:#6c3b66;--card:#33273b;--ink:#fbeedd;--mut:#c0a9b5;--acc:#ff8f6b;--acc2:#5a3a52;--line:#4a3a52;--stitch:#7a5a78;--track:#43324a;--tape:#b58aff;--sh:0 8px 22px rgba(0,0,0,.45);color-scheme:dark;background:linear-gradient(180deg,#14112e,#2a1a45 60%,#3d2147) fixed}body.det #bg{display:none}
body.det{--card:#fff;--mut:#e0507a;--track:rgba(255,255,255,.28);--stitch:#f2b3c6;--acc2:#ffe3ea;--line:#f2b3c6}
body.det .c,body.det .theme,body.det .back{color:#d93d6c}
body.det .c h3,body.det .own label{color:#e0507a}
body.det .c .big{color:#d93d6c}body.det .last b{color:#fff}
body.det .own input{background:#fff3f6;color:#c0305c;border-color:#f2b3c6}
body.det .btns button{color:#c0305c}
body.det .ringw{filter:drop-shadow(0 0 10px rgba(255,255,255,.35))}
.top h1{cursor:pointer}
.tile.photo{background-size:cover;background-position:center}.tile.photo::after{border-color:rgba(255,255,255,.85)}
.fm label{display:block;font:700 15px var(--ui);color:var(--mut);margin:16px 0 6px}
.fm input[type=text],.fm input[type=url],.fm textarea{display:block;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--sky1);color:var(--ink);font:17px var(--ui)}
.fm textarea{min-height:110px;resize:vertical}
.phb{display:flex!important;align-items:center;gap:12px;padding:12px;border:2px dashed var(--stitch);border-radius:14px;cursor:pointer;font-size:18px!important}
.phb img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.idea-img{display:block;width:100%;border-radius:18px;margin-bottom:16px}
.cards a{color:var(--acc);word-break:break-all}
.cards .dl{width:100%;margin-top:18px}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="cv"></canvas>
<div id="app"></div>
<script id="state" type="application/json">{"gifts":[]}</script>
<script>
var S=JSON.parse(document.getElementById('state').textContent),app=document.getElementById('app');
var OWN=false,CFG=null,dirty=false,cur=null,ask=false,anim=false;
var tab='gifts',ideas=[],adding=false,oid=null,draft={t:'',l:'',d:'',f:null,p:''};
try{cur=location.hash.slice(1)||null}catch(e){}
anim=!!cur;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function find(id){return S.gifts.filter(function(g){return g.id===id})[0]}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function lastTxt(d){if(!d)return'Ещё не начинал';var t=today();if(d===t)return'сегодня';var y=new Date();y.setDate(y.getDate()-1);if(d===y.getFullYear()+'-'+('0'+(y.getMonth()+1)).slice(-2)+'-'+('0'+y.getDate()).slice(-2))return'вчера';return new Date(d+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function home(){
 var h='<div class="top"><h1 data-tab="ideas">Будущие подарки</h1></div><div class="grid">';
 S.gifts.forEach(function(g,i){h+='<div class="it" style="--r:'+(i%2?1.8:-1.8)+'deg;--d:'+i*.5+'s"><div class="lab">'+esc(g.theme||'Подарок')+'</div><button class="tile" data-open="'+g.id+'">'+(g.img?'<img class="ph" src="'+esc(pv(g.img))+'" alt="">':'<span class="em">'+esc(g.emoji||'🎁')+'</span>')+'<span class="pc">'+g.progress+'%</span><span class="bar"><i style="width:'+g.progress+'%"></i></span></button></div>'});
 h+='<div class="it" style="--r:-1.5deg;--d:1s"><div class="lab">Новое</div><div class="tile soon"><span class="em">✨</span></div></div>';
 h+='<div class="it" style="--r:1.5deg;--d:1.5s"><div class="lab">Скоро</div><div class="tile soon"><span class="em">🎀</span></div></div>';
 if(OWN)h+='<div class="it" style="--r:1.5deg;--d:1.5s"><div class="lab">Для мастера</div><button class="tile add" data-act="add"><span class="em">＋</span><span>новый подарок</span></button></div>';
 return h+'</div>';
}
function detail(g){
 var C=2*Math.PI*88,h='<button class="back" data-act="back">← Назад</button><section class="hero"><div class="theme">'+esc(g.theme)+'</div>';
 h+='<div class="ringw"><svg viewBox="0 0 220 220"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a6b"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs><circle cx="110" cy="110" r="102" fill="none" stroke="var(--stitch)" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round"/><circle cx="110" cy="110" r="88" fill="none" stroke="var(--track)" stroke-width="16"/><circle class="arc" cx="110" cy="110" r="88" fill="none" stroke="url(#gr)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-g.progress/100)+'"/></svg><div class="num">'+g.progress+'%</div></div>';
 h+='<p class="last">Последний раз делал: <b>'+lastTxt(g.last)+'</b></p><div class="scroll">листай вниз ↓</div></section><div class="cards">';

function shrink(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(function(b){b?ok(b):no(new Error('img'))},'image/jpeg',.82)};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
var PV={},gmsg='';function pv(p){return PV[p]||p}
function ghH(raw){return{Authorization:'Bearer '+CFG.tok,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'}}
function ghU(p){return'https://api.github.com/repos/'+CFG.repo+'/contents/'+p}
function b64s(t){return btoa(unescape(encodeURIComponent(t)))}
function blobB64(bl){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result.split(',')[1])};r.onerror=no;r.readAsDataURL(bl)})}
async function ghPut(p,b64,msg){
 for(var k=0;k<3;k++){
  var sha,g=await fetch(ghU(p)+'?t='+Date.now(),{headers:ghH(),cache:'no-store'});
  if(g.ok)sha=(await g.json()).sha;
  var r=await fetch(ghU(p),{method:'PUT',headers:ghH(),body:JSON.stringify({message:msg,content:b64,sha:sha})});
  if(r.ok)return;
  if(r.status!==409&&r.status!==422)throw new Error(r.status===401||r.status===403||r.status===404?'нет доступа, проверь ключ':'ошибка '+r.status)}
 throw new Error('конфликт, попробуй ещё раз')}

function bg(){var b=document.getElementById("bg");if(b.firstChild)return;var h="";var th=Math.min(210,innerWidth*.27)*266/210,N=Math.max(3,Math.ceil(innerHeight/(th+12))+1);for(var r=0;r<N;r++){var t="";for(var i=0;i<24;i++){var j=i%12,n=(j*3+r*2)%8;t+='<div class="bt" style="background-image:url('+PH+');background-size:800% 100%;background-position:'+(n*100/7)+'% 0"></div>'}h+='<div class="rw '+(r==1?"r":r==2?"s":"")+'">'+t+'</div>'}b.innerHTML=h}
bg();
(function(){var cv=document.getElementById('cv'),x=cv.getContext('2d'),W,H,P=[],B=[],rm=matchMedia('(prefers-reduced-motion:reduce)').matches,dk=matchMedia('(prefers-color-scheme:dark)');
function rs(){var r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;x.setTransform(r,0,0,r,0,0)}
rs();addEventListener('resize',rs);
function mk(){return{x:Math.random()*W,y:H+10+Math.random()*60,r:1.5+Math.random()*3,vy:.15+Math.random()*.35,ph:Math.random()*6.28,s:.5+Math.random()}}
for(var i=0;i<40;i++){var q=mk();q.y=Math.random()*H;P.push(q)}
window.burst=function(px,py,n,big){for(var i=0;i<n;i++){var a=Math.random()*6.28,v=(big?3:1.5)+Math.random()*(big?6:3);B.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(big?3:1),l:1,c:['#ff8fab','#ffc86b','#7fd1b9','#b8a1ff','#ffffff'][i%5],e:['✦','♥','✿','★'][i%4],z:12+Math.random()*12})}};
function t(ts){x.clearRect(0,0,W,H);var d=dk.matches;
 P.forEach(function(p){p.y-=p.vy;p.x+=Math.sin(ts/1500+p.ph)*.3;if(p.y<-10)Object.assign(p,mk());x.globalAlpha=.35+.35*Math.sin(ts/700*p.s+p.ph);x.fillStyle=d?'#ffe9a8':'#fff';x.shadowColor=d?'#ffd36b':'#ff9eb5';x.shadowBlur=12;x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()});
 x.shadowBlur=0;B=B.filter(function(b){return b.l>0});
 B.forEach(function(b){b.x+=b.vx;b.y+=b.vy;b.vy+=.12;b.vx*=.98;b.l-=.016;x.globalAlpha=Math.max(b.l,0);x.fillStyle=b.c;x.font=b.z+'px sans-serif';x.fillText(b.e,b.x,b.y)});
 x.globalAlpha=1;requestAnimationFrame(t)}
if(!rm){requestAnimationFrame(t);addEventListener('pointerdown',function(e){burst(e.clientX,e.clientY,10,false)})}
})();
render();
(async function(){
 try{CFG=JSON.parse(localStorage.getItem('cfg')||'null')}catch(e){}
 try{
  var q=new URLSearchParams(location.search);
  if(q.has('logout')){localStorage.removeItem('cfg');CFG=null;history.replaceState(null,'',location.pathname)}
  if(q.has('admin')&&!CFG){
   var tok=prompt('Ключ доступа GitHub (вводится один раз на этом устройстве):');
   var repo=location.hostname.endsWith('.github.io')?(function(){var o=location.hostname.split('.')[0],r=location.pathname.split('/')[1]||location.hostname;return o+'/'+r})():prompt('Репозиторий (владелец/название):');
   if(tok&&repo){CFG={tok:tok.trim(),repo:repo.trim()};localStorage.setItem('cfg',JSON.stringify(CFG))}
   history.replaceState(null,'',location.pathname)}
 }catch(e){}
 var d=null;
 try{
  if(CFG){var r=await fetch(ghU('data.json')+'?t='+Date.now(),{headers:ghH(true),cache:'no-store'});if(r.ok){d=await r.json();OWN=true}else if(r.status===401){alert('Ключ не подошёл. Открой ?logout и войди заново.')}}
  if(!d){var r2=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r2.ok)d=await r2.json()}
 }catch(e){}
 if(d){S.gifts=d.gifts||[];ideas=(d.ideas||[]).sort(function(a,b){return(b.ts||0)-(a.ts||0)})}
 render();
})();
